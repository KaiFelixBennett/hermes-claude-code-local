# Hermes Agent CLI Configuration - Gemma-4-31B Setup
# WSL2 with mirrored networking -> localhost == Windows localhost

providers:
  local-llama-cpp:
    name: "llama.cpp"
    base_url: "http://127.0.0.1:8080/v1"
    api_key: "llama.cpp"
    api_mode: "chat_completions"
    default_model: "Gemma-4-31B-it GGUF"
    model: "Gemma-4-31B-it GGUF"
    models:
      - "Gemma-4-31B-it GGUF"

model:
  path: 'E:\Coding\custom-rag\data\models\gemma-4-31b-it\gemma-4-31B-it-Q4_K_M.gguf'
  default: "Gemma-4-31B-it GGUF"
  # Gemma-4 has the chat template embedded in the GGUF; leave empty.
  chat_template: ''
  backend: "hip"
  provider: "custom:local-llama-cpp"
  base_url: "http://127.0.0.1:8080/v1"
  api_key: "llama.cpp"
  # 64K context fits comfortably in 32GB VRAM with Flash Attention + KV-Q8_0
  # Gemma-4 has 256K theoretical context but 64K is the practical sweet spot
  context_length: 65536
  # Batch sizes optimized for ROCm/HIP on AMD RX 7900 XTX / AI PRO R9700
  batch_size: 512
  ubatch_size: 512
  # KV-cache quantization saves ~50% VRAM; essential for large context on 32GB
  cache_type_k: "q8_0"
  cache_type_v: "q8_0"
  # 2 parallel slots for Hermes + pi.dev simultaneous usage
  parallel_slots: 2
  # Sampling tuned per Google Gemma-4 best practices
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  min_p: 0.0
  presence_penalty: 1.5
  repeat_penalty: 1.0
  # Gemma-4 does NOT support MTP (Multi-Token Prediction)
  # For speculative decoding, use a separate draft model with --spec-type draft-model
  speculative_type: "none"
  speculative_draft_tokens: ""

tools:
  enabled:
    - bash
    - read_file
    - write_file
    - edit_file
    - web_search
    - browser

tts:
  provider: "local"
  model: "tiny"

stt:
  provider: "local"
  model: "base"

compression:
  enabled: true
  threshold: 0.60
  protect_last_n: 12
  summary_model: "Gemma-4-31B-it GGUF"

auxiliary:
  vision: { provider: "custom:local-llama-cpp", model: "Gemma-4-31B-it GGUF", timeout: 120 }
  web_extract: { provider: "custom:local-llama-cpp", model: "Gemma-4-31B-it GGUF", timeout: 120 }
  compression: { provider: "custom:local-llama-cpp", model: "Gemma-4-31B-it GGUF", timeout: 180 }
  session_search: { provider: "custom:local-llama-cpp", model: "Gemma-4-31B-it GGUF", timeout: 90 }
  skills_hub: { provider: "custom:local-llama-cpp", model: "Gemma-4-31B-it GGUF", timeout: 90 }
  approval: { provider: "custom:local-llama-cpp", model: "Gemma-4-31B-it GGUF", timeout: 60 }
  mcp: { provider: "custom:local-llama-cpp", model: "Gemma-4-31B-it GGUF", timeout: 120 }
  flush_memories: { provider: "custom:local-llama-cpp", model: "Gemma-4-31B-it GGUF", timeout: 45 }
  title_generation: { provider: "custom:local-llama-cpp", model: "Gemma-4-31B-it GGUF", timeout: 15 }

terminal:
  timeout: 300

browser:
  inactivity_timeout: 300
  dialog_timeout_s: 600

gateway:
  allowed_users: []
